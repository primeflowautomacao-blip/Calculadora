<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prop Desk Manager</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0d1014; color: #e6e8eb;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 2.5rem 1rem;
  }
  main { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 1.25rem; margin: 0 0 1.5rem; border-bottom: 1px solid #27272a; padding-bottom: .75rem; }
  h2 { font-size: 1rem; font-weight: 500; margin: 0 0 1rem; }
  section { margin-bottom: 2.5rem; }
  .panel { border: 1px solid #27272a; border-radius: 8px; padding: 1.25rem; background: #09090b; }
  form { display: grid; gap: 1rem; grid-template-columns: 1fr 1fr; }
  label { display: flex; flex-direction: column; gap: .35rem; font-size: .85rem; color: #a1a1aa; }
  input {
    background: #18181b; border: 1px solid #3f3f46; border-radius: 6px;
    color: #f4f4f5; padding: .5rem .7rem; font: inherit;
  }
  input:focus, button:focus-visible { outline: 2px solid #71717a; outline-offset: 2px; }
  .ambiente { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
  .ambiente button {
    background: transparent; color: #71717a; border: 1px solid #3f3f46; border-radius: 6px;
    padding: .5rem; font: inherit; font-weight: 600; letter-spacing: .05em; cursor: pointer;
  }
  .ambiente button.demo[aria-pressed="true"] { color: #fcd34d; border: 1px dashed #fbbf24; background: rgba(251,191,36,.08); }
  .ambiente button.real[aria-pressed="true"] { color: #6ee7b7; border: 1px solid #10b981; background: rgba(16,185,129,.12); }
  .acoes { grid-column: 1 / -1; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
  .btn {
    background: #f4f4f5; color: #18181b; border: 0; border-radius: 6px;
    padding: .55rem 1rem; font: inherit; font-weight: 600; cursor: pointer;
  }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .aviso { font-size: .9rem; }
  .ok { color: #34d399; } .erro { color: #f87171; }
  .vazio { border: 1px dashed #27272a; border-radius: 8px; padding: 1.5rem; color: #71717a; font-size: .9rem; }
  .tabela-wrap { overflow-x: auto; border: 1px solid #27272a; border-radius: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th, td { padding: .6rem .9rem; text-align: left; border-bottom: 1px solid #27272a; white-space: nowrap; }
  th { color: #a1a1aa; font-weight: 500; background: #18181b; }
  tbody tr:last-child td { border-bottom: 0; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .tag { font-size: .75rem; font-weight: 700; padding: .15rem .5rem; border-radius: 4px; letter-spacing: .05em; }
  .tag.DEMO { color: #fcd34d; border: 1px dashed #fbbf24; }
  .tag.REAL { color: #6ee7b7; border: 1px solid #10b981; background: rgba(16,185,129,.15); }
  .muted { color: #a1a1aa; }
  @media (max-width: 600px) { form { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>Prop Desk Manager</h1>

  <section>
    <div class="panel">
      <h2>Nova conta</h2>
      <form id="form">
        <label>Nome da conta *
          <input id="nome" placeholder="Ex.: Desafio 100k fase 1" required>
        </label>
        <label>Prop Firm
          <input id="prop_firm" placeholder="Opcional">
        </label>
        <div>
          <span class="muted" style="font-size:.85rem">Ambiente *</span>
          <div class="ambiente" style="margin-top:.35rem">
            <button type="button" class="demo" data-amb="DEMO" aria-pressed="true">DEMO</button>
            <button type="button" class="real" data-amb="REAL" aria-pressed="false">REAL</button>
          </div>
        </div>
        <label>Moeda
          <input id="moeda" value="USD" maxlength="3">
        </label>
        <label>Saldo inicial
          <input id="saldo" value="0" inputmode="decimal">
        </label>
        <div class="acoes">
          <button class="btn" id="btn-guardar" type="submit">Guardar conta</button>
          <span id="aviso" class="aviso" role="status"></span>
        </div>
      </form>
    </div>
  </section>

  <section>
    <h2>Contas guardadas <span id="contador" class="muted" style="font-weight:400"></span></h2>
    <div id="lista"></div>
  </section>
</main>

<script>
  // ===== CONFIGURAÇÃO: preenche com os valores do teu projeto Supabase =====
  // Supabase → Project Settings → API Keys
  const SUPABASE_URL = "https://xlgkyxvpzebvbrptnkjc.supabase.co";
  const SUPABASE_KEY = "sb_publishable_FSeqNkQRZVDTnbhg_S2oRQ_O7M5He6W"; // chave pública. Nunca a chave secreta.
  // =========================================================================

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const form = document.getElementById("form");
  const btn = document.getElementById("btn-guardar");
  const aviso = document.getElementById("aviso");
  const lista = document.getElementById("lista");
  const contador = document.getElementById("contador");
  let ambiente = "DEMO";

  function mostrarAviso(texto, tipo) {
    aviso.textContent = texto;
    aviso.className = "aviso " + tipo;
  }

  document.querySelectorAll(".ambiente button").forEach(b => {
    b.addEventListener("click", () => {
      ambiente = b.dataset.amb;
      document.querySelectorAll(".ambiente button").forEach(x =>
        x.setAttribute("aria-pressed", x === b ? "true" : "false"));
    });
  });

  function escapar(t) {
    return String(t ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  async function carregar() {
    lista.innerHTML = '<p class="muted">A carregar…</p>';
    const { data, error } = await sb.from("contas").select("*").order("created_at", { ascending: false });
    if (error) {
      lista.innerHTML = "";
      mostrarAviso("Não foi possível carregar as contas: " + error.message, "erro");
      return;
    }
    contador.textContent = `(${data.length})`;
    if (data.length === 0) {
      lista.innerHTML = '<div class="vazio">Ainda não há contas. Cria a primeira com o formulário acima.</div>';
      return;
    }
    lista.innerHTML = `
      <div class="tabela-wrap"><table>
        <thead><tr>
          <th>Nome</th><th>Prop Firm</th><th>Ambiente</th><th>Moeda</th>
          <th style="text-align:right">Saldo inicial</th><th>Criada em</th>
        </tr></thead>
        <tbody>${data.map(c => `
          <tr>
            <td>${escapar(c.nome)}</td>
            <td class="muted">${escapar(c.prop_firm ?? "—")}</td>
            <td><span class="tag ${c.ambiente}">${c.ambiente}</span></td>
            <td class="muted">${escapar(c.moeda)}</td>
            <td class="num">${Number(c.saldo_inicial).toLocaleString("pt-PT", {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
            <td class="muted">${new Date(c.created_at).toLocaleString("pt-PT")}</td>
          </tr>`).join("")}
        </tbody>
      </table></div>`;
  }

  form.addEventListener("submit", async e => {
    e.preventDefault();
    if (btn.disabled) return;

    const nome = document.getElementById("nome").value.trim();
    const saldo = Number(document.getElementById("saldo").value.replace(",", "."));
    if (!nome) return mostrarAviso("Indica o nome da conta.", "erro");
    if (!Number.isFinite(saldo)) return mostrarAviso("O saldo inicial tem de ser um número.", "erro");

    btn.disabled = true;
    btn.textContent = "A guardar…";
    mostrarAviso("", "");

    const { error } = await sb.from("contas").insert({
      nome,
      prop_firm: document.getElementById("prop_firm").value.trim() || null,
      ambiente,
      moeda: document.getElementById("moeda").value.trim().toUpperCase() || "USD",
      saldo_inicial: saldo,
    });

    btn.disabled = false;
    btn.textContent = "Guardar conta";

    if (error) return mostrarAviso("A conta não foi guardada: " + error.message, "erro");

    mostrarAviso(`Conta "${nome}" guardada no Supabase.`, "ok");
    form.reset();
    document.getElementById("moeda").value = "USD";
    document.getElementById("saldo").value = "0";
    carregar();
  });

  carregar();
</script>
</body>
</html>
